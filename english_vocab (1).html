<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }

  .progress-dot.done { background: #111; }
  .progress-dot.current { background: #888; }
  .card { background: #fff; border: 1px solid #e8e8e6; border-radius: 16px; padding: 2rem 1.5rem 1.5rem; min-height: 300px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: border-color 0.2s, transform 0.08s; user-select: none; }

  .word { font-size: 36px; font-weight: 500; color: #111; letter-spacing: -0.5px; }
  .speak-btn { background: none; border: 1px solid #e0e0e0; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
  .speak-btn:hover { background: #f5f5f3; }
  .speak-btn svg { width: 16px; height: 16px; fill: #666; }
  .ex-speak-btn { background: none; border: 1px solid #e0e0e0; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; transition: background 0.15s; }
  .ex-speak-btn:hover { background: #f5f5f3; }
  .ex-speak-btn svg { width: 11px; height: 11px; fill: #999; }
  .phonetic { font-size: 15px; color: #888; margin-top: 6px; }
  .divider { height: 1px; background: #eee; margin: 1.25rem 0; }
  .meaning-jp { font-size: 22px; color: #111; font-weight: 500; }
  .meaning-en { font-size: 14px; color: #888; margin-top: 4px; }
  .example-block { margin-top: 14px; }
  .example-row { display: flex; align-items: flex-start; gap: 8px; }
  .example-en { font-size: 14px; color: #333; line-height: 1.7; flex: 1; }
  .example-en em { font-style: normal; font-weight: 600; text-decoration: underline; text-decoration-color: #ccc; }
  .example-jp { font-size: 13px; color: #888; margin-top: 5px; padding-left: 32px; line-height: 1.6; }
  .tap-hint { font-size: 12px; color: #bbb; text-align: center; margin-top: 1rem; }
  .next-hint { font-size: 12px; color: #bbb; text-align: center; margin-top: 0.5rem; }
  .hidden { opacity: 0; pointer-events: none; }
  .visible { opacity: 1; transition: opacity 0.2s; }
  .counter { font-size: 13px; color: #bbb; text-align: center; margin-top: 0.75rem; }
  .finish { text-align: center; padding: 4rem 1rem; background: #fff; border-radius: 16px; border: 1px solid #e8e8e6; }
  .finish-score { font-size: 40px; font-weight: 500; color: #111; margin-bottom: 6px; }
  .finish-label { font-size: 14px; color: #888; margin-bottom: 2rem; }
  .btn-sm { padding: 10px 24px; border: 1px solid #ddd; border-radius: 10px; background: transparent; font-size: 14px; cursor: pointer; color: #111; }
  .btn-sm:hover { background: #f5f5f3; }
</style>

<script>
const WORDS = [{"word": "advance", "pos": "動詞", "phonetic": "/ədˈvæns/", "meaningJp": "前進する、進める", "meaningEn": "to move forward or make progress", "exampleEn": "The team advance toward the goal quickly.", "exampleJp": "チームはゴールに向かって素早く前進した。"}, {"word": "ask", "pos": "動詞", "phonetic": "/æsk/", "meaningJp": "尋ねる、頼む", "meaningEn": "to say something as a question or request", "exampleEn": "She asked the coach for advice.", "exampleJp": "彼女はコーチにアドバイスを求めた。"}, {"word": "attack", "pos": "動詞", "phonetic": "/əˈtæk/", "meaningJp": "攻撃する", "meaningEn": "to take aggressive action against", "exampleEn": "The striker attack the defense with speed.", "exampleJp": "ストライカーはスピードでディフェンスを攻撃した。"}, {"word": "begin", "pos": "動詞", "phonetic": "/bɪˈɡɪn/", "meaningJp": "始める、始まる", "meaningEn": "to start doing or happening", "exampleEn": "The match will begin at three o'clock.", "exampleJp": "試合は3時に始まる。"}, {"word": "block", "pos": "動詞", "phonetic": "/blɒk/", "meaningJp": "ブロックする、遮る", "meaningEn": "to stop something from passing or succeeding", "exampleEn": "He managed to block the powerful shot.", "exampleJp": "彼は強烈なシュートをブロックすることに成功した。"}, {"word": "bring", "pos": "動詞", "phonetic": "/brɪŋ/", "meaningJp": "持ってくる", "meaningEn": "to carry or take something to a place", "exampleEn": "Please bring your boots to practice.", "exampleJp": "練習にスパイクを持ってきてください。"}, {"word": "buy", "pos": "動詞", "phonetic": "/baɪ/", "meaningJp": "買う", "meaningEn": "to get something by paying money", "exampleEn": "He wants to buy new football boots.", "exampleJp": "彼は新しいサッカースパイクを買いたい。"}, {"word": "call", "pos": "動詞", "phonetic": "/kɔːl/", "meaningJp": "呼ぶ、叫ぶ", "meaningEn": "to shout or say something loudly", "exampleEn": "The captain call out to his teammates.", "exampleJp": "キャプテンはチームメイトに大声で呼びかけた。"}, {"word": "carry", "pos": "動詞", "phonetic": "/ˈkæri/", "meaningJp": "運ぶ、持ち運ぶ", "meaningEn": "to hold and take somewhere", "exampleEn": "She carry the ball past two defenders.", "exampleJp": "彼女はボールを持って2人のディフェンダーを抜いた。"}, {"word": "catch", "pos": "動詞", "phonetic": "/kætʃ/", "meaningJp": "捕まえる", "meaningEn": "to grab and hold something moving", "exampleEn": "The goalkeeper catch the ball safely.", "exampleJp": "ゴールキーパーは安全にボールをキャッチした。"}, {"word": "celebrate", "pos": "動詞", "phonetic": "/ˈseləbreɪt/", "meaningJp": "祝う、喜ぶ", "meaningEn": "to do something enjoyable for a special occasion", "exampleEn": "The players celebrate after scoring a goal.", "exampleJp": "選手たちはゴールを決めた後に喜んだ。"}, {"word": "challenge", "pos": "動詞", "phonetic": "/ˈtʃælɪndʒ/", "meaningJp": "挑む、チャレンジする", "meaningEn": "to compete with or question someone", "exampleEn": "She challenge the defender for the ball.", "exampleJp": "彼女はディフェンダーにボールを挑んだ。"}, {"word": "change", "pos": "動詞", "phonetic": "/tʃeɪndʒ/", "meaningJp": "変える、変わる", "meaningEn": "to become or make different", "exampleEn": "The coach change the team's formation.", "exampleJp": "コーチはチームのフォーメーションを変えた。"}, {"word": "check", "pos": "動詞", "phonetic": "/tʃek/", "meaningJp": "確認する、チェックする", "meaningEn": "to examine or verify something", "exampleEn": "Always check your equipment before a match.", "exampleJp": "試合前に必ず用具を確認しなさい。"}, {"word": "chip", "pos": "動詞", "phonetic": "/tʃɪp/", "meaningJp": "浮き球で蹴る、チップする", "meaningEn": "to kick the ball with a light lifting motion", "exampleEn": "She chip the ball over the goalkeeper.", "exampleJp": "彼女はゴールキーパーの上にチップキックをした。"}, {"word": "clean", "pos": "動詞", "phonetic": "/kliːn/", "meaningJp": "きれいにする", "meaningEn": "to remove dirt from something", "exampleEn": "He clean his boots after every match.", "exampleJp": "彼は試合のたびにスパイクをきれいにした。"}, {"word": "clear", "pos": "動詞", "phonetic": "/klɪər/", "meaningJp": "クリアする、取り除く", "meaningEn": "to kick the ball away from danger", "exampleEn": "The defender clear the ball from the goal line.", "exampleJp": "ディフェンダーはゴールラインからボールをクリアした。"}, {"word": "close", "pos": "動詞", "phonetic": "/kləʊz/", "meaningJp": "閉じる、近づく", "meaningEn": "to shut or move near to something", "exampleEn": "She close down the opponent quickly.", "exampleJp": "彼女は素早く相手に寄せた。"}, {"word": "control", "pos": "動詞", "phonetic": "/kənˈtrəʊl/", "meaningJp": "コントロールする", "meaningEn": "to direct or manage something", "exampleEn": "He control the ball with his chest.", "exampleJp": "彼は胸でボールをコントロールした。"}, {"word": "cook", "pos": "動詞", "phonetic": "/kʊk/", "meaningJp": "料理する", "meaningEn": "to prepare food by heating", "exampleEn": "She cook pasta for the team dinner.", "exampleJp": "彼女はチームディナーのためにパスタを作った。"}, {"word": "cross", "pos": "動詞", "phonetic": "/krɒs/", "meaningJp": "クロスを上げる、渡る", "meaningEn": "to kick the ball from the side into the centre", "exampleEn": "He cross the ball into the penalty area.", "exampleJp": "彼はペナルティエリアにクロスを上げた。"}, {"word": "cry", "pos": "動詞", "phonetic": "/kraɪ/", "meaningJp": "泣く、叫ぶ", "meaningEn": "to shed tears or shout out", "exampleEn": "She cry with joy after winning the cup.", "exampleJp": "彼女はカップ優勝の喜びで泣いた。"}, {"word": "cut", "pos": "動詞", "phonetic": "/kʌt/", "meaningJp": "切る、カットする", "meaningEn": "to move sharply in a new direction", "exampleEn": "He cut inside and shoot at goal.", "exampleJp": "彼はカットインしてシュートを打った。"}, {"word": "dance", "pos": "動詞", "phonetic": "/dɑːns/", "meaningJp": "踊る", "meaningEn": "to move rhythmically to music", "exampleEn": "The fans dance when their team scored.", "exampleJp": "チームが得点するとファンたちは踊った。"}, {"word": "decide", "pos": "動詞", "phonetic": "/dɪˈsaɪd/", "meaningJp": "決める、決断する", "meaningEn": "to make a choice or come to a conclusion", "exampleEn": "She decide to shoot instead of pass.", "exampleJp": "彼女はパスではなくシュートを選んだ。"}, {"word": "defend", "pos": "動詞", "phonetic": "/dɪˈfend/", "meaningJp": "守る、ディフェンスする", "meaningEn": "to protect against attack", "exampleEn": "They defend well and kept a clean sheet.", "exampleJp": "彼らはよく守り、クリーンシートを保った。"}, {"word": "draw", "pos": "動詞", "phonetic": "/drɔː/", "meaningJp": "引き分ける、引く", "meaningEn": "to finish a game with equal scores", "exampleEn": "Both teams draw one all.", "exampleJp": "両チームは1対1で引き分けた。"}, {"word": "dribble", "pos": "動詞", "phonetic": "/ˈdrɪbl/", "meaningJp": "ドリブルする", "meaningEn": "to move the ball forward with small kicks", "exampleEn": "She dribble past three defenders.", "exampleJp": "彼女は3人のディフェンダーをドリブルで抜いた。"}, {"word": "drink", "pos": "動詞", "phonetic": "/drɪŋk/", "meaningJp": "飲む", "meaningEn": "to take liquid into the mouth and swallow", "exampleEn": "Players drink water during the break.", "exampleJp": "選手たちはハーフタイムに水を飲む。"}, {"word": "drive", "pos": "動詞", "phonetic": "/draɪv/", "meaningJp": "強く蹴る、ドライブする", "meaningEn": "to hit or kick powerfully", "exampleEn": "He drive the ball into the top corner.", "exampleJp": "彼はボールをコーナーに力強く蹴り込んだ。"}, {"word": "eat", "pos": "動詞", "phonetic": "/iːt/", "meaningJp": "食べる", "meaningEn": "to put food in your mouth and swallow it", "exampleEn": "Athletes eat well before a big match.", "exampleJp": "選手たちは大きな試合の前によく食べる。"}, {"word": "enjoy", "pos": "動詞", "phonetic": "/ɪnˈdʒɔɪ/", "meaningJp": "楽しむ", "meaningEn": "to get pleasure from something", "exampleEn": "She enjoy playing football with her friends.", "exampleJp": "彼女は友達とサッカーをするのを楽しんでいる。"}, {"word": "explain", "pos": "動詞", "phonetic": "/ɪkˈspleɪn/", "meaningJp": "説明する", "meaningEn": "to make something clear or easy to understand", "exampleEn": "The coach explain the new tactics clearly.", "exampleJp": "コーチは新しい戦術をわかりやすく説明した。"}, {"word": "feel", "pos": "動詞", "phonetic": "/fiːl/", "meaningJp": "感じる", "meaningEn": "to experience an emotion or physical sensation", "exampleEn": "She feel nervous before the final.", "exampleJp": "彼女は決勝前に緊張を感じた。"}, {"word": "find", "pos": "動詞", "phonetic": "/faɪnd/", "meaningJp": "見つける", "meaningEn": "to discover or locate something", "exampleEn": "He find space behind the defence.", "exampleJp": "彼はディフェンスの裏にスペースを見つけた。"}, {"word": "finish", "pos": "動詞", "phonetic": "/ˈfɪnɪʃ/", "meaningJp": "終える、決める", "meaningEn": "to complete or score at the end of a move", "exampleEn": "She finish the move with a great goal.", "exampleJp": "彼女は素晴らしいゴールで攻撃を決めた。"}, {"word": "fix", "pos": "動詞", "phonetic": "/fɪks/", "meaningJp": "直す、修正する", "meaningEn": "to repair or correct something", "exampleEn": "The coach fix the problem at half time.", "exampleJp": "コーチはハーフタイムに問題を修正した。"}, {"word": "foul", "pos": "動詞", "phonetic": "/faʊl/", "meaningJp": "ファウルする", "meaningEn": "to commit an illegal action in a game", "exampleEn": "He foul the striker in the box.", "exampleJp": "彼はボックス内でストライカーにファウルした。"}, {"word": "forget", "pos": "動詞", "phonetic": "/fəˈɡet/", "meaningJp": "忘れる", "meaningEn": "to fail to remember something", "exampleEn": "Don't forget to warm up before the game.", "exampleJp": "試合前にウォームアップするのを忘れないで。"}, {"word": "get", "pos": "動詞", "phonetic": "/ɡet/", "meaningJp": "得る、手に入れる", "meaningEn": "to obtain or receive something", "exampleEn": "She get the ball and run forward.", "exampleJp": "彼女はボールを受け取って前に走った。"}, {"word": "give", "pos": "動詞", "phonetic": "/ɡɪv/", "meaningJp": "渡す、与える", "meaningEn": "to hand something to someone", "exampleEn": "He give a perfect pass to his teammate.", "exampleJp": "彼はチームメイトに完璧なパスを出した。"}, {"word": "go", "pos": "動詞", "phonetic": "/ɡəʊ/", "meaningJp": "行く、進む", "meaningEn": "to move or travel somewhere", "exampleEn": "Go forward and support the attack!", "exampleJp": "前に出て攻撃をサポートしろ！"}, {"word": "happen", "pos": "動詞", "phonetic": "/ˈhæpən/", "meaningJp": "起こる、生じる", "meaningEn": "to occur or take place", "exampleEn": "A lot happen in the last five minutes.", "exampleJp": "最後の5分間にたくさんのことが起きた。"}, {"word": "have", "pos": "動詞", "phonetic": "/hæv/", "meaningJp": "持つ、ある", "meaningEn": "to own or possess something", "exampleEn": "We have a great team this season.", "exampleJp": "今シーズン、私たちは素晴らしいチームを持っている。"}, {"word": "head", "pos": "動詞", "phonetic": "/hed/", "meaningJp": "ヘディングする", "meaningEn": "to hit the ball with your head", "exampleEn": "He head the ball into the net.", "exampleJp": "彼はボールをヘディングしてネットに入れた。"}, {"word": "hear", "pos": "動詞", "phonetic": "/hɪər/", "meaningJp": "聞こえる", "meaningEn": "to perceive sound with your ears" let deck = [], current = 0, phase = 0, score = 0;

speechSynthesis.getVoices();
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
function getVoice() {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang === "en-US" && v.name.includes("Google"))
      || vs.find(v => v.lang.startsWith("en-US"))
      || vs.find(v => v.lang.startsWith("en")) || null;
}
function speakText(text, rate) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate || 0.85;
  const v = getVoice(); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function speakWord()    { speakText(deck[current].word, 0.8); }
function speakExample() { speakText(deck[current].exampleEn, 0.85); }

function renderCard() {
  const w = deck[current];
  const re = new RegExp("\\b(" + w.word + "(?:s|ed|ing|d|er|ly)?)\\b", "gi");
  const exHtml = (w.exampleEn || "").replace(re, "<em>$1</em>");
  document.getElementById("app").innerHTML =
    '<div class="progress" id="progress"></div>' +
    '<div class="card" onclick="handleTap()">' +
      '<div>' +
        '<div class="pos">' + w.pos + '</div>' +
        '<div class="word-row">' +
          '<div class="word">' + w.word + '</div>' +
          '<button class="speak-btn" onclick="event.stopPropagation();speakWord()">' +
            '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="phonetic">' + w.phonetic + '</div>' +
      '</div>' +
      '<div id="back" class="hidden">' +
        '<div class="divider"></div>' +
        '<div class="meaning-jp">' + w.meaningJp + '</div>' +
        '<div class="meaning-en">' + w.meaningEn + '</div>' +
        '<div class="example-block">' +
          '<div class="example-row">' +
            '<button class="ex-speak-btn" onclick="event.stopPropagation();speakExample()">' +
              '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>' +
            '</button>' +
            '<div class="example-en">' + exHtml + '</div>' +
          '</div>' +
          '<div class="example-jp">' + w.exampleJp + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tap-hint" id="tap-hint">タップして意味を確認</div>' +
      '<div class="next-hint hidden" id="next-hint">もう一度タップで次へ</div>' +
    '</div>' +
    '<div class="counter">' + (current+1) + ' / ' + deck.length + '</div>';
  updateProgress();
}

function updateProgress() {
  document.getElementById("progress").innerHTML =
    deck.map(function(_, i) {
      return '<div class="progress-dot ' + (i < current ? "done" : i === current ? "current" : "") + '"></div>';
    }).join("");
}

function handleTap() {
  if (phase === 0) {
    phase = 1;
    document.getElementById("back").className = "visible";
    document.getElementById("tap-hint").classList.add("hidden");
    document.getElementById("next-hint").classList.remove("hidden");
  } else {
    score++;
    current++;
    if (current >= deck.length) showFinish();
    else { phase = 0; renderCard(); }
  }
}

function showFinish() {
  document.getElementById("app").innerHTML =
    '<div class="finish">' +
      '<div class="finish-score">' + score + ' / ' + WORDS.length + '</div>' +
      '<div class="finish-label">今回確認した単語数</div>' +
      '<button class="btn-sm" onclick="startCards()">もう一度やる</button>' +
    '</div>';
}

function startCards() {
  deck = WORDS.slice(); current = 0; phase = 0; score = 0;
  renderCard();
}

startCards();
</script>
</body>
</html>
