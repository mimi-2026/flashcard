    margin-bottom: 22px;

  .stat {

    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;

    overflow: hidden;

    font-size: 12.5px;

<script>
  const DATA = JSON.parse(document.getElementById("tracker-data").textContent);
  const PARTNERS = DATA.partners;
  const CANCELLATION = DATA.cancellation;

  const STAGES = ["inquired", "awaiting_reply", "quote_received", "in_discussion"];
  const META = {
    inquired:        { label: "Inquired",         dot: "--c-inquired",   bg: "--c-inquired-bg",   desc: "Initial contact sent" },
    awaiting_reply:  { label: "Awaiting Reply",   dot: "--c-awaiting",   bg: "--c-awaiting-bg",   desc: "Waiting on them to respond" },
    quote_received:  { label: "Quote Received",   dot: "--c-quote",      bg: "--c-quote-bg",      desc: "Pricing / proposal in hand" },
    in_discussion:   { label: "In Discussion",    dot: "--c-discussion", bg: "--c-discussion-bg", desc: "Active back-and-forth" },
    inactive:        { label: "Inactive",         dot: "--c-inactive",   bg: "--c-inactive-bg",   desc: "Creator currently on hiatus" },
    passed_dropped:  { label: "Passed / Dropped", dot: "--c-passed",     bg: "--c-passed-bg",     desc: "Not being pursued" },
  };
  const STATUS_ORDER = ["inquired","awaiting_reply","quote_received","in_discussion","inactive","passed_dropped"];

  function stageIndex(status) {
    const i = STAGES.indexOf(status);
    return i === -1 ? -1 : i;
  }

  function renderLegend() {
    const el = document.getElementById("legend");
    el.innerHTML = STATUS_ORDER.map(s => `
      <span class="item"><span class="swatch" style="background:var(${META[s].dot})"></span>${META[s].label} — ${META[s].desc}</span>
    `).join("");
  }

  function renderStats() {
    const counts = {};
    STATUS_ORDER.forEach(s => counts[s] = 0);
    PARTNERS.forEach(p => counts[p.status] = (counts[p.status] || 0) + 1);
    const el = document.getElementById("stats");
    el.innerHTML = STATUS_ORDER.map(s => `
      <div class="stat" style="--dot:var(${META[s].dot})">
        <div class="n">${counts[s]}</div>
        <div class="l">${META[s].label}</div>
      </div>
    `).join("");
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function fieldGroup(title, html) {
    return `<div class="field-group"><h4>${title}</h4>${html}</div>`;
  }

  function renderCard(p) {
    const idx = stageIndex(p.status);
    const isBranch = idx === -1;
    const m = META[p.status];

    const segs = STAGES.map((s, i) => {
      const done = !isBranch && i <= idx;
      return `<div class="seg${done ? " done" : ""}" style="${done ? `--dot:var(${m.dot})` : ""}"></div>`;
    }).join("");

    const conceptHtml = p.conceptDev
      ? `<span class="concept-badge"><b>Concept Dev:</b> ${esc(p.conceptDev)}</span>`
      : "";

    const deliverablesHtml = p.deliverables
      ? fieldGroup("Strengths / Deliverables", `<p class="kv">${esc(p.deliverables)}</p>`)
      : "";

    const pricingHtml = p.pricing
      ? fieldGroup("Pricing", `<p class="kv">${esc(p.pricing)}</p>`)
      : fieldGroup("Pricing", `<p class="muted-note">Not yet provided.</p>`);

    const nextStepHtml = p.nextStep
      ? fieldGroup("Next Step", `<p class="kv">${esc(p.nextStep)}</p>`)
      : "";

    const logHtml = p.log
      ? fieldGroup("Log / Notes", `<div class="log-box">${esc(p.log)}</div>`)
      : fieldGroup("Log / Notes", `<p class="muted-note">No entries yet.</p>`);

    return `
      <details class="card" data-name="${esc(p.name.toLowerCase())}">
        <summary>
          <div class="avatar">${esc(p.name.slice(0,2).toUpperCase())}</div>
          <div class="id-block">
            <div class="name">${esc(p.name)}</div>
            <div class="type">${esc(p.type)}</div>
          </div>
          <div class="stage-track" title="${isBranch ? m.label : m.label + ' — stage ' + (idx+1) + ' of ' + STAGES.length}">${isBranch ? '' : segs}</div>
          <span class="status-pill" style="--dot:var(${m.dot});--dotbg:var(${m.bg})">${m.label}</span>
          ${conceptHtml}
          <span class="updated mono">${p.lastUpdatedRaw ? esc(p.lastUpdatedRaw) : "—"}</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </summary>
        <div class="card-body">
          ${pricingHtml}
          ${deliverablesHtml}
          ${nextStepHtml}
          ${logHtml}
        </div>
      </details>
    `;
  }

  let activeType = "all";

  function applyFilters() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const statusF = document.getElementById("statusFilter").value;
    const sortBy = document.getElementById("sortBy").value;

    let items = PARTNERS.slice();

    if (activeType !== "all") items = items.filter(p => p.type === activeType);
    if (statusF !== "all") items = items.filter(p => p.status === statusF);
    if (q) items = items.filter(p =>
      (p.name + " " + (p.nextStep || "") + " " + (p.log || "")).toLowerCase().includes(q)
    );

    if (sortBy === "name") items.sort((a,b) => a.name.localeCompare(b.name));
    else if (sortBy === "status") items.sort((a,b) => STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status));
    else items.sort((a,b) => new Date(b.lastUpdated || 0) - new Date(a.lastUpdated || 0));

    const list = document.getElementById("list");
    list.innerHTML = items.length
      ? items.map(renderCard).join("")
      : `<div class="empty">No partners match these filters.</div>`;
  }

  function renderCancellation() {
    const el = document.getElementById("cancelGrid");
    el.innerHTML = CANCELLATION.map(c => `
      <div class="cancel-card">
        <div class="head">
          <span class="platform">${esc(c.platform)}</span>
          <span class="escrow-badge">Escrow: ${esc(c.escrow)}</span>
        </div>
        <p>${esc(c.policy)}</p>
      </div>
    `).join("");
  }

  document.getElementById("search").addEventListener("input", applyFilters);
  document.getElementById("statusFilter").addEventListener("change", applyFilters);
  document.getElementById("sortBy").addEventListener("change", applyFilters);
  document.getElementById("typeFilter").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    activeType = btn.dataset.type;
    [...document.getElementById("typeFilter").children].forEach(b => b.classList.toggle("active", b === btn));
    applyFilters();
  });

  renderLegend();
  renderStats();
  applyFilters();
  renderCancellation();
</script>
